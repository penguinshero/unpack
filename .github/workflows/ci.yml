name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install unrar (for RAR extraction tests)
        run: sudo apt-get update && sudo apt-get install -y unrar

      - name: Build
        run: go build -v ./...

      - name: Run tests
        run: go test -v ./...

      - name: Vet
        run: go vet ./...
