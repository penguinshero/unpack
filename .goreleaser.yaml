version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: unpack
    main: ./cmd/unpack
    binary: unpack
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: unpack-archive
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

nfpms:
  - id: unpack-deb
    package_name: unpack
    vendor: penguinshero
    homepage: https://github.com/penguinshero/unpack
    maintainer: Muhammad Shawon <your-email@example.com>
    description: Universal archive extractor for Linux — detects format by content, not extension.
    license: MIT
    formats:
      - deb
    # only build .deb for linux builds, not darwin
    builds:
      - unpack
    recommends:
      - unrar
    contents:
      - src: README.md
        dst: /usr/share/doc/unpack/README.md
      - src: LICENSE
        dst: /usr/share/doc/unpack/LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: penguinshero
    name: unpack
  header: |
    ## unpack {{ .Tag }}

    Universal archive extractor for Linux.
