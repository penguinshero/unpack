version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: unpack
    main: ./cmd/unpack
    binary: unpack
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: unpack-archive
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: penguinshero
    name: unpack
  header: |
    ## unpack {{ .Tag }}

    Universal archive extractor for Linux.
